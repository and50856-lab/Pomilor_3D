name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Статическая проверка кода
        run: python3 lint_gd.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Godot и шаблоны экспорта
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          NAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fL --retry 3 -o godot.zip "$BASE/${NAME}_linux.x86_64.zip"
          curl -fL --retry 3 -o templates.tpz "$BASE/${NAME}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "${NAME}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"
          godot --version

      - name: Debug-ключ и настройки редактора
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          MM="${GODOT_VERSION%.*}"
          for f in "editor_settings-4.tres" "editor_settings-${MM}.tres"; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/android_sdk_path = \"${ANDROID_SDK}\""
              echo "export/android/java_sdk_path = \"${JAVA_HOME}\""
              echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > "$HOME/.config/godot/$f"
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Импорт проекта
        run: godot --headless --path . --import || true

      - name: Самотест игры (запуск кода без экрана)
        run: |
          set +e
          timeout 300 godot --headless --path . res://selftest.tscn 2>&1 | tee selftest.log
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" selftest.log; then
            echo "::error::В скриптах есть ошибки, смотри selftest.log в артефактах"
            echo "FAILED=1" >> "$GITHUB_ENV"
          fi
          if ! grep -q "SELFTEST_OK" selftest.log; then
            echo "::warning::Самотест не дошёл до конца"
          fi
          exit 0

      - name: Экспорт APK (обычный, Mobile — для слабых и средних телефонов)
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Pomilor3D.apk 2>&1 | tee export.log
          test -f build/Pomilor3D.apk

      - name: Экспорт APK (Forward+ — максимум графики для мощных телефонов)
        continue-on-error: true
        run: |
          cp project.godot project.godot.bak
          sed -i 's#^renderer/rendering_method="mobile"#renderer/rendering_method="forward_plus"#; s#^renderer/rendering_method.mobile="mobile"#renderer/rendering_method.mobile="forward_plus"#' project.godot
          grep -n "rendering_method" project.godot
          godot --headless --path . --export-debug "Android" build/Pomilor3D-ForwardPlus.apk 2>&1 | tee export_fp.log
          cp project.godot.bak project.godot

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            selftest.log
            export.log
            export_fp.log

      - uses: actions/upload-artifact@v4
        with:
          name: Pomilor3D-debug-apk
          path: build/Pomilor3D.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pomilor3D-ForwardPlus-apk
          path: build/Pomilor3D-ForwardPlus.apk
          if-no-files-found: ignore

      - name: Итог самотеста
        if: env.FAILED == '1'
        run: |
          echo "APK собран, но самотест нашёл ошибки в скриптах (см. артефакт logs)."
          exit 1
